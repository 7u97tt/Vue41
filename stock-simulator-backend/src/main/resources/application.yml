server:
  port: 8080

spring:
  application:
    name: stock-simulator-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/stock_simulator?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

jedis:
  host: localhost
  port: 6379
  password:
  database: 0
  timeout: 3000
  pool:
    max-total: 8
    max-idle: 8
    min-idle: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.stocksim.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.stocksim.mapper: debug
